name: 打包改进建议
description: 对应用包、Compose 生成、生命周期脚本、CI 或文档的建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        如果是 Amane 应用本身的功能需求，请到上游
        [sqzw-x/amane/issues](https://github.com/sqzw-x/amane/issues) 提。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在是什么样、为什么不好用
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的建议
      description: 期望的行为、替代方案、以及你考虑过的取舍
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - Compose / 挂载 / 授权
        - 生命周期脚本（启停、状态、升级、卸载）
        - 向导 / 应用设置
        - CI / 发布流程
        - 文档
        - 其它
    validations:
      required: true
