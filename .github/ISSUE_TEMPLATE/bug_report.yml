name: 打包 / 安装问题
description: fpk 安装、Compose、授权目录、端口、CI 相关（Amane 应用本身的问题请到上游反馈）
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先运行 `sudo bash tools/doctor.sh` 并把输出贴到下面。
        Amane **应用本身**的功能 / 刮削问题请到 [上游](https://github.com/sqzw-x/amane/issues) 反馈。
  - type: input
    id: versions
    attributes:
      label: fpk 版本 / fnOS 版本 / 架构
      placeholder: "0.19.0 / 1.2.0800 / x86_64"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 现象与复现步骤
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor.sh 输出
      render: shell
    validations:
      required: false
