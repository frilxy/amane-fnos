<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="amane-fnos：把 amane 打包成飞牛 fnOS 应用包，并每天自动跟随上游更新">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3385ff"/>
      <stop offset="1" stop-color="#0f4fc4"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3385ff"/>
      <stop offset="1" stop-color="#0f4fc4" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#7fb0ff" stroke-width="1">
    <path d="M0 40H1280M0 80H1280M0 120H1280M0 160H1280M0 200H1280M0 240H1280M0 280H1280"/>
    <path d="M80 0V320M160 0V320M240 0V320M320 0V320M400 0V320M480 0V320M560 0V320M640 0V320M720 0V320M800 0V320M880 0V320M960 0V320M1040 0V320M1120 0V320M1200 0V320"/>
  </g>

  <!-- 品牌角标 -->
  <g transform="translate(80 84)">
    <rect width="88" height="88" rx="22" fill="url(#brand)"/>
    <path d="M52 14 L24 62 H80 Z" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M46 40 L46 62 L68 51 Z" fill="url(#brand)" stroke="url(#brand)" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <text x="204" y="126" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="58" font-weight="700" letter-spacing="1">
    amane-fnos
  </text>
  <text x="206" y="172" fill="#9dc0ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24">
    飞牛 fnOS 应用包 · 官方镜像 · 每天自动跟随上游更新
  </text>

  <rect x="80" y="210" width="1120" height="2" fill="url(#line)"/>

  <g fill="#7f9dc9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20">
    <text x="80" y="256">ghcr.io/sqzw-x/amane</text>
    <text x="480" y="256">x86_64 / ARM</text>
    <text x="760" y="256">fnpack 1.2.3</text>
    <text x="1010" y="256">GPL-3.0</text>
  </g>
  <g fill="#3d5480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17">
    <text x="80" y="288">容器镜像</text>
    <text x="480" y="288">应用包架构（platform=all）</text>
    <text x="760" y="288">打包工具</text>
    <text x="1010" y="288">许可证</text>
  </g>
</svg>
