# 本文件由 frilxy/amane-fnos 的 cmd/ 生命周期脚本自动生成，手工修改会在下次启动或升级时被覆盖。
# 由 frilxy/amane-fnos 的 CI 生成；运行时会被生命周期脚本按应用设置重新生成。
# 镜像：ghcr.io/sqzw-x/amane:0.18.0
services:
  amane:
    image: ghcr.io/sqzw-x/amane:0.18.0
    container_name: amane
    user: "${TRIM_UID:-1000}:${TRIM_GID:-1000}"
    restart: unless-stopped
    ports:
      - "8000:8000"
    # 让容器内的 http://host.docker.internal:<port> 始终指向 NAS 宿主，
    # 代理地址填它就不会因为 NAS 的 DHCP 地址变化而失效。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${TRIM_DATA_SHARE_PATHS:-/var/apps/amane/shares/data}:/data"
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      AMANE_DATA_DIR: /data
      AMANE_SUPERVISED: "1"
      AMANE_HOST: 0.0.0.0
      AMANE_PORT: "8000"
      # 宽松模式：边界交给 fnOS 授权目录的 ACL；选择器可用自带路径输入框直接跳转
      AMANE_SAFE_DIRS: "ALLOW_ALL"
      # 想让容器走代理时，在「应用设置」里填写代理地址（如 http://host.docker.internal:7890）并保存
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
